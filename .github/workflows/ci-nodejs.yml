name: node.js
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.1

      - name: node install
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: install dependencies
        run: npm install

      - name: test
        run: npm test -- --coverage

      - name: report
        uses: mridang/action-test-reporter@v1.7.0
        with:
          coverage-file: coverage/lcov.info

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/

      - name: Discord Notification (SUCCESS - main push)
        if: success() && github.event_name == 'push' && github.ref_name == 'main'
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d @- ${{ secrets.DISCORD_WEBHOOK }} <<EOF
          {
            "content": " CI SUCCESS on **main** branch for commit ${GITHUB_SHA}"
          }
          EOF

      - name: Discord Notification (SUCCESS - PR)
        if: success() && github.event_name == 'pull_request'
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d @- ${{ secrets.DISCORD_WEBHOOK }} <<EOF
          {
            "content": " Pull Request #${{ github.event.pull_request.number }} passed CI successfully!"
          }
          EOF

      - name: Discord Notification (FAILURE - main)
        if: failure() && github.event_name == 'push' && github.ref_name == 'main'
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d @- ${{ secrets.DISCORD_WEBHOOK }} <<EOF
          {
            "content": " CI FAILED on **main** branch for commit ${GITHUB_SHA}"
          }
          EOF

      - name: Discord Notification (FAILURE - PR)
        if: failure() && github.event_name == 'pull_request'
        run: |
          curl -X POST -H "Content-Type: application/json" \
            -d @- ${{ secrets.DISCORD_WEBHOOK }} <<EOF
          {
            "content": " Pull Request #${{ github.event.pull_request.number }} failed CI checks!"
          }
          EOF

        
      
