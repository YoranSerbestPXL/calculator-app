name: Build Example

on:
  workflow_dispatch:

jobs:
  dependencies-example:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: build the code
        run: |
          zip -r app_bundle.zip . -x "*.git*" "app_bundle.zip"
